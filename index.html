<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKK Paint - Product Showcase</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'Georgia', 'serif'],
                        brand: ['Cinzel', 'serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #f4f5f7 0%, #e1e4e8 100%);
            color: #1a1a1a;
            overflow-x: hidden;
        }

        .serif-title {
            font-family: 'Playfair Display', serif;
        }

        /* Fade-In Entrance Animation */
        @keyframes fadeInOnly {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .animate-fade-in {
            animation: fadeInOnly 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .delay-100 { animation-delay: 0.15s; }
        .delay-200 { animation-delay: 0.3s; }
        .delay-300 { animation-delay: 0.45s; }

        /* Loading Spinner */
        .spinner {
            border: 3.5px solid rgba(0, 0, 0, 0.08);
            border-radius: 50%;
            border-top-color: #000;
            width: 48px;
            height: 48px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .carousel-track {
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        .carousel-item {
            transition: transform 0.9s cubic-bezier(0.16, 1, 0.3, 1), 
                        filter 0.9s cubic-bezier(0.16, 1, 0.3, 1), 
                        opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform, filter, opacity;
            position: absolute;
        }

        .text-transition {
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform;
        }

        .text-out {
            opacity: 0;
            transform: translateY(6px);
        }

        .text-in {
            opacity: 1;
            transform: translateY(0);
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 999px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-slate-300 relative opacity-0 animate-fade-in">

    <!-- GLOBAL LOADING OVERLAY -->
    <div id="loadingOverlay" class="fixed inset-0 bg-white/80 backdrop-blur-md flex items-center justify-center z-50 transition-opacity duration-500">
        <div class="spinner"></div>
    </div>

    <!-- TOP HEADER / NAVBAR -->
    <header class="w-full px-4 py-5 sm:px-6 md:px-12 flex items-center justify-between z-30 animate-fade-in delay-100">
        <div class="flex items-center gap-3 cursor-pointer group" onclick="resetCatalog()">
            <div class="w-9 h-7 sm:w-10 sm:h-8 flex items-center justify-center">
                <svg viewBox="0 0 100 80" class="w-full h-full fill-current text-black">
                    <path d="M 0,80 L 25,0 L 45,0 L 70,80 L 50,80 L 35,28 L 20,80 Z" />
                    <path d="M 45,0 L 65,0 L 65,35 L 85,0 L 100,0 L 78,40 L 100,80 L 83,80 L 65,48 L 65,80 L 45,80 Z" />
                    <rect x="23" y="46" width="12" height="9" fill="#eef0f2" />
                </svg>
            </div>
        </div>

        <div class="flex items-center gap-2 sm:gap-4">
            <div class="relative flex items-center">
                <input 
                    type="text" 
                    id="searchInput"
                    oninput="handleSearch(this.value)"
                    placeholder="Search..." 
                    class="w-32 sm:w-44 md:w-56 px-3.5 py-1.5 text-xs sm:text-sm bg-transparent border border-gray-400 rounded-full focus:outline-none focus:border-black transition-all duration-300 placeholder-gray-500 text-gray-800"
                >
                <i class="fa-solid fa-magnifying-glass absolute right-3 text-gray-500 text-xs pointer-events-none"></i>

                <div id="searchResults" class="hidden absolute top-full right-0 sm:right-0 mt-2 z-50 bg-white/95 backdrop-blur-md border border-gray-200/80 rounded-2xl p-2 shadow-xl w-64 sm:w-72 md:w-80 max-h-64 overflow-y-auto">
                    <!-- Search results -->
                </div>
            </div>

            <a 
                href="tel:09890199093" 
                class="px-3.5 sm:px-6 py-1.5 text-xs sm:text-sm border border-gray-400 rounded-full hover:bg-black hover:text-white transition-all duration-300 font-medium active:scale-95 inline-flex items-center justify-center text-gray-900"
            >
                Contact
            </a>
        </div>
    </header>

    <!-- MAIN CAROUSEL SHOWCASE AREA -->
    <main class="flex-1 flex flex-col justify-center items-center relative my-1 md:my-0 px-2 sm:px-4 overflow-hidden w-full animate-fade-in delay-200">
        <div class="w-full max-w-6xl mx-auto flex items-center justify-center relative min-h-[440px] sm:min-h-[520px] md:min-h-[600px]">
            <div id="carouselTrack" class="carousel-track relative w-full h-full flex items-center justify-center">
                <!-- Dynamically Rendered from Firestore -->
            </div>
        </div>

        <div class="md:hidden mt-2 z-20">
            <button 
                onclick="openDetailsModal()" 
                class="px-5 py-2 bg-gray-200/80 backdrop-blur border border-gray-300 rounded-full text-xs font-serif text-gray-800 shadow-sm active:scale-95 transition-all flex items-center gap-2"
            >
                <span>Tap to view details</span>
                <i class="fa-solid fa-chevron-right text-[9px] text-gray-500"></i>
            </button>
        </div>
    </main>

    <!-- FOOTER SECTION -->
    <footer class="w-full px-4 sm:px-6 py-5 md:px-16 grid grid-cols-1 md:grid-cols-3 items-center z-30 gap-4 md:gap-0">
        
        <div id="desktopDetailsContainer" class="text-transition opacity-0 hidden md:block space-y-1 text-sm font-sans text-gray-800 leading-relaxed">
            <p><span class="font-medium">Brand :</span> <span id="d-brand" class="font-serif"></span></p>
            <p><span class="font-medium">Price :</span> <span id="d-price" class="font-serif"></span></p>
            <p><span class="font-medium">Unit :</span> <span id="d-unit" class="font-serif"></span></p>
            <p><span class="font-medium">Stocks :</span> <span id="d-stocks" class="font-serif"></span></p>
        </div>

        <div class="w-full flex items-center justify-between md:justify-center relative">
            <button 
                onclick="prevSlide()" 
                aria-label="Previous Product"
                class="md:hidden w-11 h-11 rounded-full border border-gray-800 flex items-center justify-center hover:bg-black hover:text-white transition-all active:scale-90 shadow-sm backdrop-blur-sm z-10"
            >
                <i class="fa-solid fa-chevron-left text-sm"></i>
            </button>

            <div id="titleContainer" class="text-transition opacity-0 text-center mx-auto">
                <h1 id="productTitleCode" class="serif-title text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-normal tracking-wide text-gray-900 select-none">
                </h1>
            </div>

            <button 
                onclick="nextSlide()" 
                aria-label="Next Product"
                class="md:hidden w-11 h-11 rounded-full border border-gray-800 flex items-center justify-center hover:bg-black hover:text-white transition-all active:scale-90 shadow-sm backdrop-blur-sm z-10"
            >
                <i class="fa-solid fa-chevron-right text-sm"></i>
            </button>
        </div>

        <div class="hidden md:flex items-center justify-end gap-3">
            <button 
                onclick="prevSlide()" 
                aria-label="Previous Product"
                class="w-12 h-12 rounded-full border border-gray-800 flex items-center justify-center hover:bg-black hover:text-white transition-all active:scale-90 shadow-sm"
            >
                <i class="fa-solid fa-chevron-left text-base"></i>
            </button>
            <button 
                onclick="nextSlide()" 
                aria-label="Next Product"
                class="w-12 h-12 rounded-full border border-gray-800 flex items-center justify-center hover:bg-black hover:text-white transition-all active:scale-90 shadow-sm"
            >
                <i class="fa-solid fa-chevron-right text-base"></i>
            </button>
        </div>
    </footer>

    <!-- PRODUCT DETAILS SPECIFICATIONS MODAL (Smooth Backdrop & Card Transitions) -->
    <div id="detailsModal" onclick="handleModalBackdropClick(event)" class="fixed inset-0 z-50 bg-black/0 backdrop-blur-0 hidden opacity-0 transition-all duration-400 ease-out flex items-center justify-center p-4">
        <div id="detailsModalCard" class="bg-white/95 backdrop-blur-md rounded-3xl p-6 md:p-8 max-w-sm w-full shadow-2xl border border-white/60 transform scale-90 opacity-0 transition-all duration-400 ease-out relative">
            
            <button onclick="closeDetailsModal()" class="absolute top-5 right-5 w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-gray-600 hover:text-black transition">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>

            <div class="flex items-center gap-2 text-xs font-semibold text-gray-500 uppercase tracking-widest mb-1">
                <span id="modal-brand-tag" class="px-2.5 py-0.5 bg-gray-200 rounded-full text-gray-800"></span>
                <span>Specifications</span>
            </div>

            <h3 id="modal-title" class="serif-title text-3xl font-normal text-gray-900 mt-1"></h3>
            <p id="modal-subtitle" class="text-xs text-gray-500 font-sans tracking-wider mb-6">uniLac GLOSS ENAMEL</p>

            <div class="space-y-3 text-sm text-gray-800 border-t border-b border-gray-100 py-4 mb-6">
                <div class="flex justify-between items-center"><span class="text-gray-500">Brand</span><span id="modal-brand" class="font-medium"></span></div>
                <div class="flex justify-between items-center"><span class="text-gray-500">Price</span><span id="modal-price" class="font-serif font-bold text-black text-base"></span></div>
                <div class="flex justify-between items-center"><span class="text-gray-500">Unit</span><span id="modal-unit" class="font-medium"></span></div>
                <div class="flex justify-between items-center"><span class="text-gray-500">Stock Status</span><span id="modal-stocks" class="font-medium text-emerald-600"></span></div>
            </div>

            <div class="flex items-center gap-3">
                <a href="tel:09123456789" class="flex-1 py-3 bg-black text-white rounded-2xl text-xs md:text-sm font-medium text-center hover:bg-gray-800 transition active:scale-95 shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-phone text-xs"></i>
                    <span>Contact / Call Now</span>
                </a>
                <button onclick="closeDetailsModal()" class="px-5 py-3 border border-gray-300 rounded-2xl text-xs md:text-sm font-medium text-gray-700 hover:bg-gray-100 transition active:scale-95">
                    Close
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // ======= FIREBASE CONFIGURATION =======
        const firebaseConfig = {
  apiKey: "AIzaSyAW5BNlFf0SBhC1vP8PfMOjItPRtzjLKdU",
  authDomain: "akk-store-9.firebaseapp.com",
  projectId: "akk-store-9",
  storageBucket: "akk-store-9.firebasestorage.app",
  messagingSenderId: "906521838751",
  appId: "1:906521838751:web:3d4648a4749de6e06c0eaa",
  measurementId: "G-5YHS8SZG9N"
};

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let products = [];
        let currentIndex = 0;

        function fetchProductsFromFirestore() {
            db.collection("products").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
                products = [];
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    products.push({
                        id: doc.id,
                        code: data.code || 'UNKNOWN',
                        brand: data.brand || 'GENERIC',
                        subTitle: data.unit ? `${data.unit} PACK` : 'PAINT PRODUCT',
                        price: `${Number(data.price || 0).toLocaleString()} MMK`,
                        unit: data.unit || '1 gallon',
                        stocks: Number(data.stock || 0),
                        image: data.image || '',
                        keywords: `${data.code} ${data.brand}`.toLowerCase()
                    });
                });

                if (products.length > 0) {
                    if (currentIndex >= products.length) currentIndex = 0;
                    initDOMCardsStacked();

                    const loader = document.getElementById('loadingOverlay');
                    if (loader) {
                        loader.style.opacity = '0';
                        setTimeout(() => {
                            loader.classList.add('hidden');
                            updateCarouselPositions();
                            updateProductTextWithAnimation(true);
                        }, 400);
                    }
                } else {
                    document.getElementById('loadingOverlay')?.classList.add('hidden');
                    document.getElementById('carouselTrack').innerHTML = `<p class="text-gray-400 text-sm">ပစ္စည်းများ မရှိသေးပါ။</p>`;
                    document.getElementById('productTitleCode').innerText = "No Products";
                }
            }, (error) => {
                console.error("Error fetching products: ", error);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchProductsFromFirestore();
            setupTouchEvents();
        });

        function initDOMCardsStacked() {
            const track = document.getElementById('carouselTrack');
            track.innerHTML = products.map((product, idx) => {
                const isOutOfStock = product.stocks <= 0;
                
                return `
                <div 
                    id="card-item-${idx}"
                    onclick="handleItemClick(${idx})"
                    style="transform: translateX(0px) scale(0.6); opacity: 0;"
                    class="carousel-item cursor-pointer select-none flex flex-col items-center justify-center w-80 h-[420px] sm:w-[420px] sm:h-[480px] md:w-[520px] md:h-[540px]"
                >
                    ${product.image ? `
                        <div class="w-full h-full bg-transparent flex flex-col items-center justify-center relative overflow-hidden">
                            <img src="${product.image}" alt="${product.code}" class="w-full h-full object-contain pointer-events-none transition-all duration-500 drop-shadow-2xl">
                            
                            ${isOutOfStock ? `
                                <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                                    <span class="bg-red-600 text-white text-xs sm:text-sm font-bold px-5 py-2 rounded-full uppercase tracking-wider shadow-2xl animate-pulse">Out of Stock</span>
                                </div>
                            ` : ''}
                        </div>
                    ` : generatePaintBucketSVG(product)}
                </div>
            `;
            }).join('');
        }

        function generatePaintBucketSVG(product) {
            const isOutOfStock = product.stocks <= 0;
            return `
            <div class="w-full h-full bg-transparent flex flex-col items-center justify-center text-center relative">
                <i class="fa-solid fa-image text-7xl text-gray-300 mb-2"></i>
                <span class="font-bold text-base text-gray-700">${product.code}</span>
                ${isOutOfStock ? '<span class="absolute bg-red-600 text-white text-xs font-bold px-5 py-2 rounded-full uppercase tracking-wider shadow-2xl animate-pulse">Out of Stock</span>' : ''}
            </div>
            `;
        }

        function updateCarouselPositions() {
            const isMobile = window.innerWidth < 640;
            const spacing = isMobile ? 200 : 400; 
            
            products.forEach((_, idx) => {
                const card = document.getElementById(`card-item-${idx}`);
                if (!card) return;

                let offset = idx - currentIndex;
                const half = Math.floor(products.length / 2);
                if (offset > half) offset -= products.length;
                if (offset < -half) offset += products.length;

                let xTranslate = offset * spacing;
                let opacity = 1;
                let scale = 1;
                let blur = 0;
                let zIndex = 30 - Math.abs(offset) * 10;
                let rotateY = offset * (isMobile ? -8 : -15);

                if (offset === 0) {
                    scale = 1;
                    blur = 0;
                    opacity = 1;
                    rotateY = 0;
                } else if (Math.abs(offset) === 1) {
                    scale = isMobile ? 0.65 : 0.75;
                    blur = 4;
                    opacity = 0.7;
                } else {
                    scale = 0.45;
                    blur = 10;
                    opacity = 0;
                }

                card.style.transform = `translateX(${xTranslate}px) scale(${scale}) rotateY(${rotateY}deg)`;
                card.style.filter = `blur(${blur}px)`;
                card.style.opacity = opacity;
                card.style.zIndex = zIndex;
            });
        }

        function updateProductTextWithAnimation(isInitial = false) {
            if (products.length === 0) return;
            const titleContainer = document.getElementById('titleContainer');
            const detailsContainer = document.getElementById('desktopDetailsContainer');
            const current = products[currentIndex];

            if (isInitial) {
                document.getElementById('productTitleCode').innerText = current.code;
                document.getElementById('d-brand').innerText = current.brand;
                document.getElementById('d-price').innerText = current.price;
                document.getElementById('d-unit').innerText = current.unit;
                document.getElementById('d-stocks').innerText = `${current.stocks} available`;
                
                titleContainer.classList.remove('opacity-0');
                detailsContainer.classList.remove('opacity-0');
                titleContainer.classList.add('text-in');
                detailsContainer.classList.add('text-in');
                return;
            }

            titleContainer.classList.remove('text-in');
            titleContainer.classList.add('text-out');
            detailsContainer.classList.remove('text-in');
            detailsContainer.classList.add('text-out');

            setTimeout(() => {
                document.getElementById('productTitleCode').innerText = current.code;
                document.getElementById('d-brand').innerText = current.brand;
                document.getElementById('d-price').innerText = current.price;
                document.getElementById('d-unit').innerText = current.unit;
                document.getElementById('d-stocks').innerText = `${current.stocks} available`;

                titleContainer.classList.remove('text-out');
                titleContainer.classList.add('text-in');
                detailsContainer.classList.remove('text-out');
                detailsContainer.classList.add('text-in');
            }, 200);
        }

        function handleItemClick(idx) {
            if (idx === currentIndex) {
                openDetailsModal();
            } else {
                currentIndex = idx;
                updateCarouselPositions();
                updateProductTextWithAnimation();
            }
        }

        function nextSlide() {
            if (products.length === 0) return;
            currentIndex = (currentIndex + 1) % products.length;
            updateCarouselPositions();
            updateProductTextWithAnimation();
        }

        function prevSlide() {
            if (products.length === 0) return;
            currentIndex = (currentIndex - 1 + products.length) % products.length;
            updateCarouselPositions();
            updateProductTextWithAnimation();
        }

        // Modal ပေါ်လာချိန် Smooth Animation
        function openDetailsModal() {
            if (products.length === 0) return;
            const current = products[currentIndex];
            
            document.getElementById('modal-title').innerText = current.code;
            document.getElementById('modal-subtitle').innerText = current.subTitle;
            document.getElementById('modal-brand-tag').innerText = current.brand;
            document.getElementById('modal-brand').innerText = current.brand;
            document.getElementById('modal-price').innerText = current.price;
            document.getElementById('modal-unit').innerText = current.unit;
            document.getElementById('modal-stocks').innerText = current.stocks > 0 ? `${current.stocks} available` : 'Out of Stock (ကုန်နေပါပြီ)';

            const backdrop = document.getElementById('detailsModal');
            const card = document.getElementById('detailsModalCard');
            
            backdrop.classList.remove('hidden');
            // အမည်းရောင်နောက်ခံနှင့် Blur တဖြည်းဖြည်းပေါ်လာရန်
            setTimeout(() => {
                backdrop.classList.remove('bg-black/0', 'backdrop-blur-0', 'opacity-0');
                backdrop.classList.add('bg-black/40', 'backdrop-blur-sm', 'opacity-100');
                
                card.classList.remove('scale-90', 'opacity-0');
                card.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        // Modal ပျောက်သွားချိန် Smooth Animation
        function closeDetailsModal() {
            const backdrop = document.getElementById('detailsModal');
            const card = document.getElementById('detailsModalCard');

            // အမည်းရောင်နောက်ခံနှင့် Card တဖြည်းဖြည်းမှေးမှိန်ပျောက်ကွယ်ရန်
            backdrop.classList.remove('bg-black/40', 'backdrop-blur-sm', 'opacity-100');
            backdrop.classList.add('bg-black/0', 'backdrop-blur-0', 'opacity-0');

            card.classList.remove('scale-100', 'opacity-100');
            card.classList.add('scale-90', 'opacity-0');

            setTimeout(() => {
                backdrop.classList.add('hidden');
            }, 400); // Animation ကြာချိန်နှင့် ကိုက်ညီအောင် 400ms ထားရှိသည်
        }

        function handleModalBackdropClick(e) {
            if (e.target.id === 'detailsModal') {
                closeDetailsModal();
            }
        }

        function handleSearch(query) {
            const resultsContainer = document.getElementById('searchResults');
            const rawQuery = query.trim().toLowerCase();

            if (!rawQuery) {
                resultsContainer.classList.add('hidden');
                return;
            }

            const matches = products.filter(p => {
                const searchStr = `${p.code} ${p.brand} ${p.subTitle} ${p.keywords}`.toLowerCase();
                return searchStr.includes(rawQuery);
            });

            if (matches.length > 0) {
                resultsContainer.innerHTML = matches.map(p => `
                    <div 
                        onclick="selectProduct('${p.id}')"
                        class="p-2 sm:p-2.5 hover:bg-gray-100 rounded-xl cursor-pointer flex items-center justify-between transition"
                    >
                        <div>
                            <p class="font-serif font-bold text-xs sm:text-sm text-gray-900">${p.code} - ${p.brand}</p>
                            <p class="text-[10px] sm:text-xs text-gray-500">${p.subTitle}</p>
                        </div>
                        <span class="text-[10px] sm:text-xs font-semibold text-gray-700 ml-2">${p.price}</span>
                    </div>
                `).join('');
                resultsContainer.classList.remove('hidden');
            } else {
                resultsContainer.innerHTML = `<div class="p-3 text-xs text-gray-500 text-center">No matching paint products</div>`;
                resultsContainer.classList.remove('hidden');
            }
        }

        function selectProduct(id) {
            const targetIdx = products.findIndex(p => p.id === id);
            if (targetIdx !== -1) {
                currentIndex = targetIdx;
                updateCarouselPositions();
                updateProductTextWithAnimation();
                document.getElementById('searchInput').value = '';
                document.getElementById('searchResults').classList.add('hidden');
            }
        }

        function resetCatalog() {
            if (products.length === 0) return;
            currentIndex = 0;
            updateCarouselPositions();
            updateProductTextWithAnimation();
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').classList.add('hidden');
        }

        document.addEventListener('click', (e) => {
            const searchInput = document.getElementById('searchInput');
            const searchResults = document.getElementById('searchResults');
            if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                searchResults.classList.add('hidden');
            }
        });

        function setupTouchEvents() {
            const touchArea = document.getElementById('carouselTrack');
            let startX = 0;
            let endX = 0;

            touchArea.addEventListener('touchstart', (e) => {
                startX = e.changedTouches[0].screenX;
            }, { passive: true });

            touchArea.addEventListener('touchend', (e) => {
                endX = e.changedTouches[0].screenX;
                handleGesture();
            }, { passive: true });

            function handleGesture() {
                if (startX - endX > 35) nextSlide();
                if (endX - startX > 35) prevSlide();
            }
        }

        window.addEventListener('resize', () => {
            updateCarouselPositions();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
            if (e.key === 'Escape') closeDetailsModal();
        });
    </script>
</body>
</html>
